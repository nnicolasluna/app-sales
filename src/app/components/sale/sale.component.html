<h1 class="text-2xl font-bold mb-4 pt-4">Ventas</h1>

<button mat-stroked-button color="secondary" class="mb-4" (click)="openCreateSaleModal()">
    Agregar Venta
</button>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 w-full">
    <ng-container matColumnDef="user_name">
        <th mat-header-cell *matHeaderCellDef> Nombre del Usuario </th>
        <td mat-cell *matCellDef="let sale"> {{ sale.user_name }} </td>
    </ng-container>
    <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef> Total </th>
        <td mat-cell *matCellDef="let sale"> {{ sale.total}} </td>
    </ng-container>
    <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef> Creado </th>
        <td mat-cell *matCellDef="let sale"> {{ sale.created_at | date:'dd/MM/yyyy HH:mm' }} </td>
    </ng-container>
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Acciones </th>
        <td mat-cell *matCellDef="let sale" class="text-center">
            <button mat-stroked-button color="primary" (click)="openDetailModal(sale)">
                Ver Detalle
            </button>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" pageSize="10" showFirstLastButtons>
</mat-paginator>
