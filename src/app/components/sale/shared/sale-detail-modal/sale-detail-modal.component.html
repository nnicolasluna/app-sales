<h5 mat-dialog-title class="text-xl font-bold">Detalle de Venta #{{ sale.id }}</h5>

<mat-dialog-content class="mat-typography">
    <div class="flex flex-col gap-4 py-2">
        <div class="grid grid-cols-2 gap-2 bg-gray-50 p-3 rounded-lg">
            <p><strong>Fecha:</strong> {{ sale.created_at | date:'dd/MM/yyyy HH:mm' }}</p>
            <p><strong>Total Venta:</strong> <span class="text-green-600 font-bold">{{ sale.total}}</span></p>
        </div>
        <h5 class="text-md font-semibold mt-2">Productos Comprados</h5>
        <table mat-table [dataSource]="sale.sale_details || []" class="mat-elevation-z1 w-full">
            <ng-container matColumnDef="product">
                <th mat-header-cell *matHeaderCellDef> Producto </th>
                <td mat-cell *matCellDef="let detail" class="py-2">
                    <div class="flex items-center gap-2">
                        <span>{{ detail.product?.name }}</span>
                    </div>
                </td>
            </ng-container>
            <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef> Precio </th>
                <td mat-cell *matCellDef="let detail"> {{ detail.price }} </td>
            </ng-container>
            <ng-container matColumnDef="quantity">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Cant. </th>
                <td mat-cell *matCellDef="let detail" class="text-center"> {{ detail.quantity }} </td>
            </ng-container>
            <ng-container matColumnDef="subtotal">
                <th mat-header-cell *matHeaderCellDef class="text-right"> Subtotal </th>
                <td mat-cell *matCellDef="let detail" class="text-right font-medium"> {{ detail.subtotal }} </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-flat-button color="primary" (click)="close()">Cerrar</button>
</mat-dialog-actions>
